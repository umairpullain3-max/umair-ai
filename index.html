<!DOCTYPE html>
<html lang="ur" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#131314">
<title>UMAIR AI — Gemini Style Chat</title>
<style>
:root{
  --bg-main: #131314;
  --bg-card: #1e1f20;
  --bg-chat: #282a2c;
  --border-color: #3c4043;
  --accent-blue: #8ab4f8;
  --text-main: #e3e3e3;
  --text-muted: #8e918f;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI', Tahoma, sans-serif;}
body{
  background:var(--bg-main);
  color:var(--text-main);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
header{
  background:var(--bg-main);
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border-color);
  position:sticky;
  top:0;
  z-index:100;
}
.logo{font-size:20px;font-weight:bold;color:white;}
.logo span{color:var(--accent-blue);}

.top-controls{display:flex;gap:8px;align-items:center;}
.lang-select, .key-btn {
  background: var(--bg-card);
  color: var(--text-main);
  border: 1px solid var(--border-color);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 13px;
  outline: none;
  cursor: pointer;
}
.key-btn{background: #1a73e8;border:none;font-weight:600;color:white;}

main{
  flex:1;
  max-width:750px;
  width:100%;
  margin:0 auto;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:15px;
  padding-bottom: 120px;
}

/* API Key Bar */
.api-section {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.api-section input {
  flex: 1;
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 8px 12px;
  color: white;
  font-size: 13px;
  outline: none;
}

/* Chat Container (Gemini Style) */
.chat-container {
  display: flex;
  flex-direction: column;
  gap: 15px;
  width: 100%;
}
.message {
  padding: 14px 18px;
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.6;
  max-width: 90%;
  word-wrap: break-word;
  white-space: pre-wrap;
}
.user-msg {
  background: var(--bg-chat);
  color: var(--text-main);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.ai-msg {
  background: transparent;
  color: var(--text-main);
  align-self: flex-start;
  border: 1px solid var(--border-color);
  border-bottom-left-radius: 4px;
  width: 100%;
}
.ai-msg strong {color: var(--accent-blue); display:block; margin-bottom:5px;}

/* Fixed Bottom Input Box */
.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-main);
  padding: 12px;
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: center;
}
.input-box-wrapper {
  max-width: 750px;
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 24px;
  display: flex;
  align-items: center;
  padding: 8px 15px;
  gap: 10px;
}
textarea {
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-size: 15px;
  resize: none;
  height: 24px;
  max-height: 120px;
  outline: none;
}
.btn-send {
  background: var(--accent-blue);
  color: #131314;
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
</style>
</head>
<body>

<header>
  <div class="logo">UMAIR <span>AI</span></div>
  <div class="top-controls">
    <select id="langSelect" class="lang-select">
      <option value="ur">اردو</option>
      <option value="hi">हिन्दी</option>
      <option value="en">English</option>
      <option value="rom">Roman English</option>
    </select>
  </div>
</header>

<main>
  <!-- API Key Box -->
  <div class="api-section">
    <input type="password" id="apiKeyInput" placeholder="Google Gemini API Key یہاں درج کریں...">
    <button class="key-btn" onclick="saveApiKey()">محفوظ کریں</button>
  </div>

  <!-- Chat History Container -->
  <div class="chat-container" id="chatContainer">
    <div class="message ai-msg">
      <strong>UMAIR AI</strong>
      السلام علیکم! میں آپ کا مرکزی AI ایجنٹ ہوں۔ اوپر اپنی API Key محفوظ کریں اور نیچے چیٹ میں مجھ سے کچھ بھی پوچھیں یا بزنس/ویب سائٹ کا حکم دیں۔
    </div>
  </div>
</main>

<!-- Bottom Sticky Input Box -->
<div class="input-area">
  <div class="input-box-wrapper">
    <textarea id="message" placeholder="یہاں پیغام لکھیں..." rows="1" oninput="autoResize(this)"></textarea>
    <button class="btn-send" onclick="sendToAI()">↑</button>
  </div>
</div>

<script>
window.onload = function() {
  const savedKey = localStorage.getItem("umair_gemini_key");
  if(savedKey) {
    document.getElementById("apiKeyInput").value = savedKey;
  }
}

function saveApiKey() {
  const key = document.getElementById("apiKeyInput").value.trim();
  if(!key) {
    alert("پہلے درست API Key لکھیں۔");
    return;
  }
  localStorage.setItem("umair_gemini_key", key);
  alert("API Key کامیابی سے محفوظ ہو گئی ہے!");
}

function autoResize(textarea) {
  textarea.style.height = '24px';
  textarea.style.height = textarea.scrollHeight + 'px';
}

async function sendToAI() {
  const apiKey = localStorage.getItem("umair_gemini_key");
  const lang = document.getElementById("langSelect").value;
  const msgInput = document.getElementById("message");
  const msg = msgInput.value.trim();
  const chatContainer = document.getElementById("chatContainer");

  if(!apiKey) {
    alert("پہلے اوپر خانے میں اپنی API Key محفوظ کریں!");
    return;
  }
  if(!msg) return;

  // Append User Message
  const userDiv = document.createElement("div");
  userDiv.className = "message user-msg";
  userDiv.textContent = msg;
  chatContainer.appendChild(userDiv);

  msgInput.value = "";
  msgInput.style.height = '24px';
  window.scrollTo(0, document.body.scrollHeight);

  // Append Loading AI Message
  const aiDiv = document.createElement("div");
  aiDiv.className = "message ai-msg";
  aiDiv.innerHTML = `<strong>UMAIR AI</strong>소چ رہا ہے...`;
  chatContainer.appendChild(aiDiv);
  window.scrollTo(0, document.body.scrollHeight);

  const systemPrompt = "You are UMAIR AI, an advanced personal AI agent built for Umair. Reply in the exact same language or script the user uses (Urdu, Hindi, English, or Roman English). Help him build businesses, write website code, and manage digital work.";

  try {
    // Using the stable gemini-2.5-flash endpoint compatible with modern v1 API
    const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [
          { role: "user", parts: [{ text: systemPrompt + "\n\nUser: " + msg }] }
        ]
      })
    });

    const data = await response.json();
    if(data.candidates && data.candidates[0].content.parts[0].text) {
      aiDiv.innerHTML = `<strong>UMAIR AI</strong>${data.candidates[0].content.parts[0].text}`;
    } else if(data.error) {
      aiDiv.innerHTML = `<strong>UMAIR AI (ایرر)</strong>${data.error.message}`;
    } else {
      aiDiv.innerHTML = `<strong>UMAIR AI</strong>ڈیٹا حاصل کرنے میں مسئلہ ہوا۔`;
    }
  } catch (error) {
    aiDiv.innerHTML = `<strong>UMAIR AI (کنکشن ایرر)</strong>${error.message}`;
  }
  window.scrollTo(0, document.body.scrollHeight);
}
</script>

</body>
</html>
